name: Build APKs

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAKT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "TRAKT_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build, test, and lint
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_KEYSTORE_PASSWORD: ${{ secrets.TRAKT_KEYSTORE_PASSWORD }}
          TRAKT_KEY_ALIAS: ${{ secrets.TRAKT_KEY_ALIAS }}
          TRAKT_KEY_PASSWORD: ${{ secrets.TRAKT_KEY_PASSWORD }}
        run: >
          ./gradlew
          :app:assembleDebug
          :app:assembleRelease
          :app:testDebugUnitTest
          :app:lintDebug
          --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-tracker-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          debug_apk="$RUNNER_TEMP/tvtracker-${version}-debug.apk"
          release_source="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          cp app/build/outputs/apk/debug/app-debug.apk "$debug_apk"

          if [[ "$release_source" == *unsigned* ]]; then
            release_apk="$RUNNER_TEMP/tvtracker-${version}-unsigned.apk"
          else
            release_apk="$RUNNER_TEMP/tvtracker-${version}.apk"
          fi
          cp "$release_source" "$release_apk"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$debug_apk" "$release_apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$debug_apk" "$release_apk" \
              --title "TV Tracker $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
